name: Gallery

# Separate from ci.yml so a failing submission names the gallery rather than
# the plugin. ci.yml still runs on every pull request. The paths cover
# everything the gallery and the site read: `gallery/` is the data,
# `CHANGELOG.md` is where plugin versions are validated against, `turbo.json`
# and the lockfile change what the build does.
on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "CHANGELOG.md"
      - "turbo.json"
      - ".github/workflows/gallery.yml"
  pull_request:
    paths:
      - "gallery/**"
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "CHANGELOG.md"
      - "turbo.json"
      - ".github/workflows/gallery.yml"

jobs:
  check:
    name: Gallery data and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The contract for a submission: schema, file roles, magic bytes, sizes,
      # plugin version against CHANGELOG.md.
      - run: pnpm gallery:check
      - run: pnpm --filter @pebbly/gallery test
      - run: pnpm --filter @pebbly/gallery typecheck
      - run: pnpm --filter @pebbly/web run check
      - run: pnpm --filter @pebbly/web run lint:fsd
      # A build here is a check that the site still compiles against the data,
      # not a deploy — Vercel deploys only from main (see apps/web/vercel.json).
      - run: pnpm turbo run build --filter=@pebbly/web

  benchmarks:
    name: Benchmark runs come from maintainers
    # Benchmark results are the project's own measurements, run under the fixed
    # setup by the people in gallery/MAINTAINERS. Anyone else contributes gallery
    # generations; a `benchmark:` block or a prompt change from them fails here.
    # The PR author comes from the event (trusted), never from the YAML, and the
    # list is read from the BASE branch so a PR cannot add itself. This job is a
    # fast early signal: the real gate is CODEOWNERS review on gallery/ and
    # .github/, since a pull request can edit its own workflow.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject benchmark results and benchmark prompts from non-maintainers
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          base="origin/${BASE_REF}"
          author=$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          if git show "${base}:gallery/MAINTAINERS" 2>/dev/null \
              | sed 's/#.*//' | tr '[:upper:]' '[:lower:]' | awk '{$1=$1};1' \
              | grep -qxF "$author"; then
            echo "${PR_AUTHOR} is a maintainer — benchmark runs allowed"
            exit 0
          fi
          failed=0
          # Prompts, packs (a pack hides its members from the grid, so an outsider
          # could bury someone else's work), the allowlist itself and the code that
          # enforces all of it: an outsider's PR may not touch any of them, or it
          # could list itself.
          prompts=$(git diff --no-renames --name-only "${base}...HEAD" -- gallery/prompts/ gallery/packs/ gallery/MAINTAINERS gallery/src/ .github/)
          if [ -n "$prompts" ]; then
            echo "::error::Benchmark prompts, gallery/packs, gallery/MAINTAINERS, gallery/src and .github are maintained by the project. Changed:"
            echo "$prompts"
            failed=1
          fi
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            # generation.yaml is strict, so the only way to carry results is a
            # top-level `benchmark` key, quoted or not.
            if grep -Eq "^[\"']?benchmark[\"']?[[:space:]]*:" "$file"; then
              echo "::error file=${file}::Benchmark runs are submitted by maintainers only — remove the benchmark block to submit this as a gallery generation."
              failed=1
            fi
          done < <(git diff --no-renames --diff-filter=AM --name-only "${base}...HEAD" -- 'gallery/generations/*/generation.yaml')
          exit $failed

  scope:
    name: Submission touches only its own folder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The three-dot diff needs the merge base, which a shallow clone lacks.
          fetch-depth: 0
      - name: Reject a generation PR that changes anything but its own new folders
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/${BASE_REF}"
          # A folder counts as the PR's own only if it does not exist on the
          # base branch — adding one file to someone else's folder does not
          # make it yours.
          own=""
          for folder in $(git diff --no-renames --diff-filter=A --name-only "${base}...HEAD" -- gallery/generations/ | cut -d/ -f1-3 | sort -u); do
            if [ -z "$(git ls-tree -d "${base}" -- "${folder}")" ]; then
              own="${own}${folder}/"$'\n'
            fi
          done
          if [ -z "$own" ]; then
            echo "no new generation folder — nothing to guard"
            exit 0
          fi
          echo "new generation folder(s):"
          printf '%s' "$own"
          outside=""
          while IFS= read -r path; do
            inside=false
            while IFS= read -r prefix; do
              [ -n "$prefix" ] && case "$path" in "$prefix"*) inside=true ;; esac
            done <<< "$own"
            [ "$inside" = true ] || outside="${outside}${path}"$'\n'
          done < <(git diff --no-renames --name-only "${base}...HEAD")
          if [ -n "$outside" ]; then
            echo "::error::A generation PR must only add its own new folder(s) under gallery/generations/. Also changed:"
            printf '%s' "$outside"
            echo "Move those changes to a separate pull request." >&2
            exit 1
          fi
          echo "generation PR is confined to its own folder(s)"
