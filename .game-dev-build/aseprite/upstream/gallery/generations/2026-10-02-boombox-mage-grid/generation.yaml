title: Boombox mage and his sound blast (grid)
description: 'The boombox-mage benchmark, r1. A 128×64 street-mage in PICO-8 with a magic boombox on his shoulder, then a 14-frame anime special attack: a swing into a braced aim, a 300 ms charge hold, a one-frame black-silhouette impact on a full-canvas flash, five blast frames of growing sound arcs with a 3 px recoil, and a dissipate into dark fragments. Each step ran in its own fresh omp session (claude-opus-5-5), launched through Herdr one after another, with the step text sent verbatim after the `/skill:studio ` command prefix. The operator created the document and loaded the PICO-8 palette before step 1, and handed step 2 a copy of the step-1 file. No image model, no reference, no messages beyond the step text. The sessions ran from the repository root, where gallery/prompts is readable; their logs show no read of gallery/ at all. The MCP server and skills were the 0.5.0 code built from the repository before the version bump, with `draw` kind `grid`, which the sessions used; the Aseprite extension in the window still reported 0.4.0 and lacked the later Lua fixes (a frame reorder attempted in the tree run failed on it).'
