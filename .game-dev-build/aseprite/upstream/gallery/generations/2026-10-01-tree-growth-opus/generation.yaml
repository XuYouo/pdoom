title: Cherry tree from seed to bloom
description: "The tree-growth benchmark, r1. A 64×64 cherry tree in bloom in PICO-8, then a 21-frame growth from a seed built backwards from that exact tree: sprout with two seed leaves, sapling, a trunk thickening bottom-up, green masses swelling into the final shapes, buds, and bloom spreading from the tips with drifting petals. The final frame matches the step-1 export byte for byte. Each step ran in its own fresh omp session (claude-opus-5-5), launched through Herdr one after another, with the step text sent verbatim after the `/skill:studio ` command prefix. The operator created the document and loaded the PICO-8 palette before step 1, and handed step 2 a copy of the step-1 file. No image model, no reference, no messages beyond the step text. The sessions ran from the repository root, where gallery/prompts is readable; their logs show no read of gallery/ at all."
date: 2026-10-01
author:
  name: Nik Fedorov
  github: fedorovvvv
plugin: 0.4.0
harness: omp
models:
