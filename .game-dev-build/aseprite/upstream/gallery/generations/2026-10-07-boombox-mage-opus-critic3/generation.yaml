benchmark:
  prompt: boombox-mage
  revision: 1
  results:
    - criterion: mage-validate
      pass: true
      note: "validate: Clean, score 100, no findings."
    - criterion: mage-palette
      pass: true
      note: "palette op get returns exactly the 16 PICO-8 entries; every layer histogram uses only those colours."
    - criterion: mage-read
      pass: true
      note: "Spiky orange hair, face, dark-blue coat, red scarf and a grey boombox with two pink round speakers are all distinct in the 4× preview."
    - criterion: mage-spec
      pass: true
      note: "Layers shadow/mage/boombox, facing right, soles on y=59, ink x 6–38, 46 px tall to the head top (y=14), light-blue hem trim, scarf trails left, pink speakers face the viewer, one pink note. The hood is a small dark-blue roll behind the head that rises to y=9, so \"hood down\" is shown but only just."
    - criterion: mage-shading
      pass: true
      note: "Coat #1d2b53 with #83769c light and black folds; skin #ffccaa/#ab5236/#fff1e8; boombox #5f574f/#c2c3c7/#7e2553/#fff1e8. Upper-left light reads; coat shading is sparse."
    - criterion: attack-tagged
      pass: true
      note: "14 frames; one tag attack, frames 1–14, direction forward."
    - criterion: attack-layers
      pass: true
      note: "Layers exactly shadow, mage, boombox, fx-charge, fx-flash, fx-wave, fx-particles. validate with expect.layerFrames fx-charge 1–5, fx-flash 6, fx-wave 7–14 (the ranges of the file's own cels; the run's reported frame plan was not compared) passes."
    - criterion: attack-anticipation
      pass: true
      note: "Frame 2 raises the boombox overhead, frame 3 aims it forward, frames 3–5 hold a braced wide stance with bent knees and a backward lean; pink specks scatter around on frames 1–3 and pull in to the speakers with rings on 4–5."
    - criterion: attack-impact
      pass: true
      note: "Frame 6, 50 ms: mage, boombox and shadow cels are all #000000; fx-flash fills the canvas with #ffec27/#fff1e8, with streaks fanning out right and downward from the boombox and a plain flat yellow area on the left."
    - criterion: attack-wave
      pass: true
      note: "Frames 7–11: arcs go from a 4 px sliver to four wide arcs, each moving right, with a new small arc at the speakers every frame; not one arc copied."
    - criterion: attack-recoil
      pass: true
      note: "Mage min x 3 → 1 and boombox 36 → 34 over frames 7–9 (2 px); light grey dust ticks at the feet; coat and scarf stream back; he settles on frames 12–14."
    - criterion: attack-dissipate
      pass: true
      note: "Frames 12–14: arcs break into dashes and dots that fade through pink and #7e2553 to #1d2b53; all seven layers have opacity 255."
    - criterion: attack-timing
      pass: true
      note: "Anticipation 100/90/120, hold 220/260, impact 50, blast 50/60/60/70/70, recovery 100/130, last frame 400."
    - criterion: attack-on-model
      pass: true
      note: "Proportions, outfit and colours hold on every non-impact frame in the filmstrip; validate raised no volume-drift finding."
    - criterion: attack-validate
      pass: true
      note: "validate passed, score 90, 0 errors, 2 outline warnings (one on mage frame 2, one on fx-particles); palette is still the 16 PICO-8 entries."
