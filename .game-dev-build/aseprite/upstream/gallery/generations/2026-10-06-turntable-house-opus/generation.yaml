benchmark:
  prompt: turntable-house
  revision: 2
  results:
    - criterion: house-validate
      pass: true
      note: validate clean, score 100; no errors or warnings.
    - criterion: house-palette
      pass: true
      note: Exactly the 16 PICO-8 entries.
    - criterion: house-read
      pass: false
      note: The red roof covers most of the front wall, so the porch merges into it and the door, shutters and flower box are a few pixels; the round gable window and barrel are not on the visible faces.
    - criterion: house-spec
      pass: true
      note: Layers ground/shadow/house; front wall left, right gable right; plinth 2:1; chimney on the back slope near the right gable.
    - criterion: house-geometry
      pass: true
      note: Verticals vertical; box and roof edges parallel.
    - criterion: house-light
      pass: true
      note: Front wall cream, right gable brown; roof uses #ff004d, #7e2553 and a black edge; #1d2b53 shadow falls right and toward the viewer, on the plinth. Wall tones are only just three.
    - criterion: spin-tagged
      pass: true
      note: 16 frames × 125 ms; forward tag spin 1–16.
    - criterion: spin-ground
      pass: true
      note: All 16 ground cels are linked (cel list).
    - criterion: spin-pivot
      pass: true
      note: The cottage stays centred on the plinth by eye; no visible drift.
    - criterion: spin-even
      pass: true
      note: Front face-on at 3, gable at 7, back at 11, other gable at 15; three-quarter views at 1, 5, 9 and 13.
    - criterion: spin-volume
      pass: false
      note: Frames 7 and 15 (ridge toward the viewer) are narrow and tall with the chimney sticking up much further than on the other frames; frames 3 and 11 show a wide flat roof.
    - criterion: spin-solid
      pass: false
      note: Frame 9 shows only two of the back wall's three windows.
    - criterion: spin-occlusion
      pass: true
      note: Porch, barrel and firewood appear and hide with their sides; the chimney base is hidden behind the roof on the far slope (frames 5 and 13).
    - criterion: spin-light
      pass: true
      note: The left-facing wall and slope are the brightest on frames 1, 5, 9 and 13 and darken as they turn away; judged by eye, not per face.
    - criterion: spin-shadow
      pass: true
      note: The shadow stays right of and toward the viewer from the cottage, on the plinth, and changes outline with the footprint.
    - criterion: spin-seamless
      pass: false
      note: Frame 1 differs from the step-1 export in 1794 pixels — the cottage was redrawn for the turn.
    - criterion: spin-validate
      pass: true
      note: validate clean (notes only); palette still 16 entries.
