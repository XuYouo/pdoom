benchmark:
  prompt: boombox-mage
  revision: 1
  results:
    - criterion: mage-validate
      pass: true
      note: validate Clean, score 100, no findings.
    - criterion: mage-palette
      pass: true
      note: 'palette op get: exactly the 16 PICO-8 entries; no off-palette pixels.'
    - criterion: mage-read
      pass: true
      note: Orange spiky hair, face, dark-blue coat with blue hem, red scarf and a boombox with two pink round speakers are all distinct in the 4× preview.
    - criterion: mage-spec
      pass: true
      note: Layers shadow/mage/boombox; character bbox x 5–38, feet on y=59, head-to-sole 45 px (mage layer y 15–59); faces right; scarf trails left; pink speakers and one pink note. The hood is only a faint roll behind the neck, so "hood down" is weakly shown.
    - criterion: mage-shading
      pass: true
      note: 'Coat uses #1d2b53, #83769c edge light on the left and black folds; skin uses #ffccaa/#ab5236/white; boombox uses #c2c3c7 top-left light, #5f574f, #1d2b53. Light from the upper left reads, though the coat is mostly flat.'
    - criterion: attack-tagged
      pass: true
      note: 15 frames, one forward tag attack 1–15.
    - criterion: attack-layers
      pass: true
      note: Layers exactly shadow, mage, boombox, fx-charge, fx-flash, fx-wave, fx-particles; validate with expect.layerFrames fx-charge 2–6, fx-flash 7, fx-wave 8–14 passes (cels exist only in those frames).
    - criterion: attack-anticipation
      pass: true
      note: Frame 2 lifts the boombox to the chest, frame 3 points it forward with a wide stance; specks sit closer to the speakers on frames 3–4. The knee bend and backward lean are modest (about 2–3 px).
    - criterion: attack-impact
      pass: true
      note: 'Frame 7, 50 ms: mage, boombox and shadow cels are all #000000; fx-flash covers the whole canvas (#ffec27/#fff1e8) with radial streaks and silhouette holes.'
    - criterion: attack-wave
      pass: true
      note: 'Frames 8–11: arcs grow and move right, with a fresh small arc beside the speakers on each frame; not a single copied arc.'
    - criterion: attack-recoil
      pass: true
      note: Mage layer min x goes 3 → 0 across frames 7–10 (3 px push-back); grey dust at the feet on frames 8–10; he returns to x=5 and settles on frames 12–15. Coat and scarf blow-back is subtle.
    - criterion: attack-dissipate
      pass: true
      note: 'Frames 12–14 arcs break into dashes and dots and fade red → #7e2553 → #1d2b53; every layer opacity is 255.'
    - criterion: attack-timing
      pass: true
      note: Anticipation 100/100/110/120, hold 220/240, impact 50, blast 60/60/60/70, recovery 100/120/140, last frame 400.
    - criterion: attack-on-model
      pass: true
      note: Proportions, outfit and colours hold on every non-impact frame in the filmstrip; poses are rebuilt from the step-1 parts; validate raised no volume-drift finding.
    - criterion: attack-validate
      pass: true
      note: 'validate passed (score 65): no errors, only 7 outline warnings, all on fx layers that are deliberately outline-free; palette is still the 16 PICO-8 entries.'
