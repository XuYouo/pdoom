benchmark:
  prompt: tree-growth
  revision: 1
  results:
    - criterion: tree-validate
      pass: true
      note: validate passes, 0 errors; one outline warning on trunk (79% #ab5236, 42 edge px other colour), which the agent justified (lit/shadow sides instead of an outline).
    - criterion: tree-palette
      pass: true
      note: palette op get returns exactly the 16 PICO-8 entries.
    - criterion: tree-read
      pass: true
      note: Trunk, branches and three pink masses read at a glance in the 4× export.
    - criterion: tree-spec
      pass: true
      note: Layers ground/trunk/canopy; ground y56–63 full width; trunk base x30–33, 4 px wide; one fork at y36 into 3 branches, each forks again; canopy x8–55, y7–35 as 3 masses with gaps.
    - criterion: tree-shading
      pass: false
      note: Cream highlights sit on the upper left of each mass, but #7e2553 dashes are scattered through the mass interiors as texture, not a shadow on the right and underneath; reads as noise rather than clumps with a shadow side.
    - criterion: grow-tagged
      pass: true
      note: 21 frames; tag grow 1–21, direction forward (0).
    - criterion: grow-final
      pass: true
      note: Frame 21 composite is byte-identical to the step-1 PNG export at 1×; fx has no pixels on frame 21.
    - criterion: grow-stages
      pass: true
      note: Filmstrip shows seed (1–2), cracking soil and crumbs, stem with two seed leaves, bark-coloured sapling with side branches, thickening young tree, green masses with pink buds (16–17), bloom from the tips (18–21) with petals on fx.
    - criterion: grow-continuous
      pass: true
      note: Trunk layer never loses a pixel between frames and no trunk pixel lies outside the final trunk's pixels; changes are additions plus recolouring along the final paths.
    - criterion: grow-ground
      pass: true
      note: All 21 ground cels are linked/identical (pixel-compared); trunk base stays on x30–33 (x31–32 for the seed and stem until frame 10, then 29–34 with roots).
    - criterion: grow-easing
      pass: true
      note: Composite change per frame is 0.0–0.6% for frames 2–8, peaks at 8.6% on frame 12, then 3.7, 1.6, 1.3, 0.8, 1.2% (bloom 5.0, 3.7, 3.5, then 1.9% on the last step).
    - criterion: grow-timing
      pass: true
      note: Seed frames 600/450 ms, growth frames 80–150 ms, final frame 2000 ms.
    - criterion: grow-validate
      pass: true
      note: validate passes, 0 errors; 20 outline warnings on trunk/canopy/fx in partial-growth frames, expected for the intermediate stages; palette is 16 PICO-8 entries.
