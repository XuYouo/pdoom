      В пруду плавают рыбки
      Иногда пролетают кометы
      Иногда бьет молния в пруд, разлетается вода и  искры
    interventions:
      - "Agent asked: loop length (8 s or ~16 s), whether a character should sit by the fire, whether to leave room for a track title. Author answered (translated from Russian): '1) about 20  2) yes, needed  3) no'."
  - text: |-
