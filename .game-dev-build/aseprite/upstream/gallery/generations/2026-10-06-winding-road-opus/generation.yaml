benchmark:
  prompt: winding-road
  revision: 1
  results:
    - criterion: land-validate
      pass: true
      note: validate clean, 0 errors; 2 outline warnings on sky and river edges, which are dither and bank edges, not silhouettes.
    - criterion: land-palette
      pass: true
      note: palette op get returns exactly the 16 PICO-8 entries.
    - criterion: land-read
      pass: true
      note: Road, castle, windmill, farmhouse and river read in the preview; the bridge is a grey dithered patch, weakly arched.
    - criterion: land-spec
      pass: true
      note: Nine layers with the exact names; sun at the right; river from the left edge to the bottom-left; 4-blade windmill.
    - criterion: land-road
      pass: true
      note: Road 61 px wide at y=92, narrows monotonically, hidden behind a hill near (110,40) and reappears on the mountain, 4 switchbacks to the gate at about (110,20); the end is 2 px, not strictly 1.
    - criterion: land-depth
      pass: true
      note: Posts shrink and bunch; mountains use only lavender, blue and peach; castle has no black; #000000 only on rows 72-95 (props, foreground).
    - criterion: loop-frames
      pass: true
      note: 24 frames of 100 ms; tag loop 1-24, forward.
    - criterion: loop-seamless
      pass: true
      note: Wagon absent on frames 1 and 24; river and smoke repeat every 8, windmill every 6, grass every 12, so frame 24 to 1 steps like any other.
    - criterion: loop-static
      pass: true
      note: sky, mountains, castle, hills, road and props cels are linked and hash-identical on all 24 frames.
    - criterion: loop-windmill
      pass: true
      note: Blades step clockwise about 15 degrees per frame around a fixed hub, repeating every 6 frames; length constant.
    - criterion: loop-river
      pass: true
      note: 8 distinct cels, repeating every 8; only glint pixels change (#fff1e8 and #29adff swaps), banks static.
    - criterion: loop-smoke
      pass: true
      note: Puff drifts up and left each frame, cycle of 8 frames; wisp dithering judged from the filmstrip only, small and hard to see.
    - criterion: loop-wagon
      pass: true
      note: Hidden on frame 1; peeks as 2 px on frame 2, 4 px by frame 3, 19 px on frame 23 and off canvas on frame 24; stays on the road and crosses the bridge; steps grow with proximity.
    - criterion: loop-validate
      pass: true
      note: validate passes, 0 errors (61 outline warnings, same two layers as step 1); palette is the 16 PICO-8 entries.
