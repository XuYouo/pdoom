benchmark:
  prompt: turntable-house
  revision: 2
  results:
    - criterion: house-validate
      pass: true
      note: validate passes with 0 errors; one outline warning on the plinth rim (71 edge px, the #00e436 highlight the brief itself asks for), not an error.
    - criterion: house-palette
      pass: true
      note: palette op get returns exactly the 16 PICO-8 entries; every drawn colour (14 used) is on it.
    - criterion: house-read
      pass: false
      note: Roof, chimney, plinth, timber framing and gable read, but under the roof overhang the porch door is not a readable brown plank door, the flower box is about 3 pink pixels, and the firewood is a few cream dots; the front-wall details are muddled.
    - criterion: house-spec
      pass: true
      note: Layers ground/shadow/house; front wall left, right gable right; near bottom corner at (67-68, 101) so footprint centre is on the pivot; plinth x 8-119 by y 62-121 (112 px wide, 2:1); chimney on back slope near right gable; door in the front wall.
    - criterion: house-geometry
      pass: true
      note: Verticals are vertical, wall and roof edges run parallel, the roof sits squarely on the walls.
    - criterion: house-light
      pass: false
      note: The shadow is right, toward the viewer, attached and wholly on the plinth, but the walls have only two face tones (#ffccaa front, #ab5236 gable) plus timber lines, short of the 3 wall tones the brief asks for.
    - criterion: spin-tagged
      pass: true
      note: 16 frames, all 125 ms; one tag spin, frames 1-16, forward.
    - criterion: spin-ground
      pass: true
      note: All 16 ground cels are linked.
    - criterion: spin-pivot
      pass: true
      note: The house bounding box is centred on x 62-65.5 and its bottom edge stays at y 96-103 on all frames; no drift or bob.
    - criterion: spin-even
      pass: true
      note: Front face-on on frame 3, left gable on 7, back on 11, right gable on 15; frames 5, 9, 13 are three-quarter views; the front wall slides right from frame 1 to 3, so the turn is counter-clockwise; frame-to-frame change is even.
    - criterion: spin-volume
      pass: true
      note: Silhouette width follows the turn symmetrically (54, 54, 49, 54, 54, 46, 36, 46 and the same again); wall and ridge height look constant, chimney sits about 4-9 px above the roof depending on angle (parallax of the back slope).
    - criterion: spin-solid
      pass: false
      note: Frame 9 is not a mirror of frame 1 (1898 px differ from the mirrored frame), but the back wall does not show three square blue windows - frame 9 has narrow blue slivers and frame 11 dark panes - and on frame 9 the rain barrel sits at the far end of the gable instead of the back wall's corner.
    - criterion: spin-occlusion
      pass: true
      note: Porch, door and flower box disappear when the front faces away; the chimney base is hidden behind the ridge on frames 3 and 7; barrel and firewood only appear on their sides.
    - criterion: spin-light
      pass: true
      note: Faces turned toward the left lit side are the lightest and re-shade as they turn (cream to brown, roof red to #7e2553); the same view direction (frames 3, 7, 11, 15) gives the same brown wall tone, so the shading follows the light, not the box.
    - criterion: spin-shadow
      pass: true
      note: Shadow falls right and toward the viewer on every frame, is attached to the base, and sits wholly on the plinth (0 px off); its size and outline change (1063-1210 px, x extent 94-110).
    - criterion: spin-seamless
      pass: false
      note: Frame 16 to 1 changes about as much as 1 to 2 (1751 vs 1743 px), but frame 1 does not match the step-1 export - the cottage was redrawn, 1175 px of the composite differ (porch, front wall, firewood).
    - criterion: spin-validate
      pass: true
      note: validate passes with 0 errors (outline warning on the plinth only); palette is still the 16 PICO-8 entries.
