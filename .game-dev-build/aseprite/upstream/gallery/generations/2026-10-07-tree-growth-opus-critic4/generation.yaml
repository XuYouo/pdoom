    - criterion: tree-validate
      pass: true
      note: "validate passes: score 100, 0 errors, 0 warnings (three 'not outlined' style notes only)."
    - criterion: tree-palette
      pass: true
      note: "palette op get returns exactly the 16 PICO-8 entries."
    - criterion: tree-read
      pass: true
      note: "Trunk, forked branches and four pink masses read at a glance in the 4× export."
    - criterion: tree-spec
      pass: true
      note: "Layers ground/trunk/canopy; ground y56–63; trunk 4 px wide at y50–53 on x30–33 with flared roots; three branches fork at y≈35 and each splits again; canopy x8–57, y6–38 as four masses (the two on the right overlap) with gaps."
    - criterion: tree-shading
      pass: true
      note: "Cream highlights upper left on each mass, #7e2553 shadow on the lower right and underneath; rounded clumps, validate reports no strays."
    - criterion: grow-tagged
      pass: true
      note: "21 frames; tag grow 1–21, direction forward."
    - criterion: grow-final
      pass: true
      note: "Frame 21 composite and ground, trunk and canopy cels are pixel-identical to step1.aseprite (0 differing pixels); fx empty on frame 21."
    - criterion: grow-stages
      pass: true
      note: "Filmstrip: seed, cracking soil with crumbs, sprout with two seed leaves, bark sapling with side branches, thickening young tree with green masses, buds on the green (frames 15–17), bloom with petals."
    - criterion: grow-continuous
      pass: true
      note: "Trunk layer loses 0 pixels between consecutive frames and no trunk pixel on any frame lies outside the final trunk's pixels."
    - criterion: grow-ground
      pass: true
      note: "Ground cel identical on all 21 frames; trunk base on x31, then x29–33 and wider as the roots flare to x27–36 (the final tree's own roots)."
    - criterion: grow-easing
      pass: true
      note: "Composite change 0.0–0.8% for frames 2–9, peak 9.8% at frame 13, then 1.1–0.4% before the bloom lifts it to 6.5% at frame 18; it settles to 2.0% on the last step."
    - criterion: grow-timing
      pass: true
      note: "Seed frames 500/450 ms, growth frames 80–150 ms, final frame 1800 ms."
    - criterion: grow-validate
      pass: true
      note: "validate passes, 0 errors, 9 outline warnings on partial-growth frames that the agent called a style quirk of tiny sprouts; palette is the 16 PICO-8 entries."
