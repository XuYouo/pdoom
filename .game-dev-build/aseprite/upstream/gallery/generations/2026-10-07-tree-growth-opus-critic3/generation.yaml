benchmark:
  prompt: tree-growth
  revision: 1
  results:
    - criterion: tree-validate
      pass: true
      note: "validate passes: score 95, 0 errors, one outline warning on trunk (70% #ab5236, 46 edge px) which the agent called a false positive for an unoutlined two-tone trunk."
    - criterion: tree-palette
      pass: true
      note: "palette op get returns exactly the 16 PICO-8 entries."
    - criterion: tree-read
      pass: true
      note: "Trunk, forked branches and three pink masses read at a glance in the 4× export."
    - criterion: tree-spec
      pass: true
      note: "Layers ground/trunk/canopy; ground y56–63; trunk 4 px wide at y47–54 on x29–32/30–33 with flared roots; three branches fork at y≈35 and each twigs again; canopy x7–57, y7–37 as three separate masses with gaps."
    - criterion: tree-shading
      pass: true
      note: "Light from the upper left: cream on top left of each mass, #7e2553 shadow to the right and underneath; masses are clumps, though the cream fills much of each mass and is a bit busy."
    - criterion: grow-tagged
      pass: true
      note: "20 frames; tag grow 1–20, direction forward."
    - criterion: grow-final
      pass: true
      note: "Frame 20 composite and ground, trunk and canopy cels are pixel-identical to step1.aseprite (0 differing pixels); fx empty on frame 20."
    - criterion: grow-stages
      pass: true
      note: "Filmstrip: seed, cracking soil with crumbs, sprout with seed leaves, bark sapling with side branches and small leaves, thickening young tree, green masses with buds, bloom from the tips with petals."
    - criterion: grow-continuous
      pass: true
      note: "Trunk layer loses 0 pixels between consecutive frames and no trunk pixel on any frame lies outside the final trunk's pixels."
    - criterion: grow-ground
      pass: true
      note: "Ground cel identical on all 20 frames; trunk base on x31 then x30–33, widening to x28–35 only as the roots flare."
    - criterion: grow-easing
      pass: true
      note: "Composite change 0.0–0.7% for frames 2–8, peak 6.6% at frame 12, then 1.5–4.1% over the bloom, 0.7% on the last step."
    - criterion: grow-timing
      pass: true
      note: "Seed frames 600/450 ms, growth frames 80–150 ms, final frame 1800 ms."
    - criterion: grow-validate
      pass: true
      note: "validate passes, 0 errors, 18 outline warnings on partial-growth frames, expected for unoutlined intermediate stages; palette is the 16 PICO-8 entries."
