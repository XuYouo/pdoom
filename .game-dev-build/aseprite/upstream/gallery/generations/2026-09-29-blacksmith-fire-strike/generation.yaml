  - { path: blacksmith.aseprite, role: source, label: "Source document, ten layers, tag attack", step: 1 }
  - { path: blacksmith.png, role: frame, label: "Frame 1, ready stance, 4×", step: 1 }
  - { path: blacksmith-strip.png, role: filmstrip, label: "All eight frames, 4×", step: 1 }
validate:
