      note: "One warning: river pixels touch the canvas edge where the water enters and leaves; named and kept."
    - criterion: land-palette
      pass: true
    - criterion: land-read
      pass: true
      note: Every landmark reads; the far road and the switchbacks are thin and only just traceable.
    - criterion: land-spec
      pass: true
      note: Horizon at y 34–35, sun at the upper right, river in from the left edge and out at the bottom-left.
    - criterion: land-road
      pass: true
      note: x 50–110 at the bottom, bridge at x 37–47, hidden past the crest at about (40–47, 41) and back at (61, 45), four switchbacks, 1 px end at the gate (110, 20). The hidden stretch is left undrawn rather than covered by the hill layer.
    - criterion: land-depth
      pass: true
      note: "Five posts shrink from 11 to 4 px and bunch with distance; #000000 only in the foreground grass."
    - criterion: loop-frames
      pass: true
      note: 24 frames at 100 ms, forward tag loop 1–24.
    - criterion: loop-seamless
      pass: true
      note: Composite diff 24→1 changes 172 px, inside the 178–515 px range of the other steps; the wagon is absent on both.
    - criterion: loop-static
      pass: true
      note: sky, mountains, castle, hills, road and props cels are linked on all 24 frames.
    - criterion: loop-windmill
      pass: true
      note: windmill-blades shows 6 distinct images repeating every 6 frames around a fixed hub.
    - criterion: loop-river
      pass: true
      note: The river layer repeats every 8 frames; banks untouched.
    - criterion: loop-smoke
      pass: true
    - criterion: loop-wagon
      pass: true
      note: Hidden on frame 1, only the canopy tip above the crest on frame 2, 4 px wide on frame 4, 9 px on the bridge, 13 px on frame 20, gone by frame 24. It switches to a side view while it drives across the bridge.
    - criterion: loop-validate
      pass: true
