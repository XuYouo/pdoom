title: Winding road through the valley
description: "The winding-road benchmark, r1. A 160×96 PICO-8 valley with a road sweeping from the bottom edge over a bridge, behind a hill and up four switchbacks to a castle gate, then a 24-frame seamless loop: a windmill turning, a river flowing toward the viewer, chimney smoke, swaying grass and a covered wagon driving the whole road toward the camera. Each step ran in its own fresh omp session (claude-opus-5-5), launched through Herdr one after another, with the step text sent verbatim after the `/skill:studio ` command prefix. The operator created the document and loaded the PICO-8 palette before step 1, and handed step 2 a copy of the step-1 file. No image model, no reference, no messages beyond the step text. The sessions ran from the repository root, where gallery/prompts is readable; their logs show no read of gallery/ at all. Step 1 needed two infrastructure restarts before the run recorded here: the first session found the aseprite MCP server unable to reach a stale 0.1.1 bridge left from an older install and stopped without drawing; the second asked to kill that bridge, the operator cancelled it, killed the stale bridge, and started this clean session. Neither aborted session touched the document. Step 2 validate is recorded from the palette, strays, layers and animation checks; the full run times out on this canvas through the MCP client."
